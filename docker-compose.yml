# Optional local Postgres for development: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ajaia_docs
    ports:
      - "6500:5432"
    volumes:
      - ajaia_docs_pg:/var/lib/postgresql/data

volumes:
  ajaia_docs_pg:
